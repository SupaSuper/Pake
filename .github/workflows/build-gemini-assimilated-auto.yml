name: Build Gemini Assimilated Auto

on:
  push:
    branches:
      - extra-mod
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.26.2"
  BUILD_RERUN_MARKER: "proxy-secret-added"

jobs:
  build:
    name: macos-latest
    runs-on: macos-latest
    env:
      PAKE_PROXY_URL: ${{ secrets.PAKE_PROXY_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Setup Node.js Environment
        uses: ./.github/actions/setup-env
        with:
          mode: build

      - name: Build CLI
        run: pnpm run cli:build

      - name: Build Gemini Assimilated
        shell: bash
        run: |
          ARGS=(
            "https://www.google.com/ai"
            "--name" "Gemini Search Assimilated"
            "--icon" "https://raw.githubusercontent.com/SupaSuper/icons/main/gemini-assimilated.png"
            "--width" "1200"
            "--height" "780"
            "--min-width" "900"
            "--min-height" "620"
            "--app-version" "1.0.0"
            "--hide-title-bar"
          )

          if [ -n "$PAKE_PROXY_URL" ]; then
            ARGS+=("--proxy-url" "$PAKE_PROXY_URL")
            echo "Proxy URL secret detected; building with Pake proxy support enabled."
          else
            echo "No PAKE_PROXY_URL secret set; building without proxy."
          fi

          node dist/cli.js "${ARGS[@]}"

      - name: Upload DMG
        uses: actions/upload-artifact@v6
        with:
          name: Gemini Search Assimilated-macOS
          path: Gemini Search Assimilated.dmg
          retention-days: 3
